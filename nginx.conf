server {
    listen 80;
    server_name _;

    # ✅ 정적파일
    location /static/ {
        alias /app/static/;
    }

    # ✅ 미디어 파일
    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
