{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "✨ 친구 관리 센터 | NeoVerse" %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'friend_management.css' %}">
    <script src="/jsi18n/"></script>
    <style>
        #toggle-bgm-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            z-index: 101;
        }
        #bgm-volume-slider {
            position: absolute;
            top: 20px;
            left: 120px; /* Adjust as needed to position next to the button */
            width: 100px;
            z-index: 101;
            -webkit-appearance: none;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            height: 10px;
            outline: none;
        }
        #bgm-volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }
        #bgm-volume-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }
        .background-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
            background-size: cover;
        }
    </style>
</head>
<body>
    <button id="toggle-bgm-btn">{% trans "BGM OFF" %}</button>
    <input type="range" id="bgm-volume-slider" min="0" max="100" value="50">

    <!-- 게임 페이지용 BGM (login.html 제외) -->
    <audio id="bgm2" loop>
        <source src="{% static 'music/game_bgm.mp3' %}" type="audio/mpeg">
    </audio>

    <script src="{% static 'bgm.js' %}"></script>

    <video autoplay muted loop class="background-video">
        <source src="{% static 'img/Friends List.mp4' %}" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="friend-container">
        <header class="header-bar">
            <h1>{% trans "🎮 친구 관리 센터" %}</h1>
            <a href="{% url 'room' %}" class="back-link">
                {% trans "← 방으로 돌아가기" %}
            </a>
        </header>

        <nav class="friend-nav">
            <button class="nav-btn active" data-target="search-section">{% trans "🔍 친구 찾기" %}</button>
            <button class="nav-btn" data-target="requests-section">{% trans "💌 받은 요청" %} <span id="nav-request-count" class="notification-badge"></span></button>
            <button class="nav-btn" data-target="friends-list-section">{% trans "🤝 내 친구" %} <span id="nav-friend-count" class="notification-badge"></span></button>
        </nav>

        <div id="search-section" class="friend-section-wrapper active">
            <h2 class="section-title">{% trans "🔍 친구 찾기 및 신청" %}</h2>
            <div class="search-box">
                <input type="text" id="search-user-input" placeholder="{% trans "친구의 고유 ID 또는 사용자 이름 입력..." %}" class="neon-input">
                <button id="search-btn" class="action-btn primary-btn">
                    <span class="emoji">🔍</span> {% trans "검색" %}
                </button>
                <button id="send-request-btn" class="action-btn primary-btn">
                    <span class="emoji">🚀</span> {% trans "요청 보내기" %}
                </button>
            </div>
            <p id="search-message" class="info-text"></p>
            <div id="search-results" class="user-list"></div>
        </div>

        <div id="requests-section" class="friend-section-wrapper">
            <h2 class="section-title">{% trans "💌 받은 친구 요청" %} <span id="request-count-section" class="notification-count"></span></h2>
            <ul id="pending-requests-list" class="user-list">
                <li class="info-text">{% trans "받은 친구 요청이 없습니다." %}</li>
            </ul>
        </div>

        <div id="friends-list-section" class="friend-section-wrapper">
            <h2 class="section-title">{% trans "🤝 내 친구 목록" %} <span id="friend-count-section" class="notification-count"></span></h2>
            <ul id="accepted-friends-list" class="user-list">
                <li class="info-text">{% trans "현재 등록된 친구가 없습니다." %}</li>
            </ul>
        </div>
    </div>
    <!-- Friend Profile Modal -->
    <div id="friend-profile-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <div class="profile-header">
                <img id="modal-profile-pic" src="" alt="{% trans "프로필 사진" %}" class="modal-profile-picture">
                <h2 id="modal-username"></h2>
            </div>
            <div id="modal-profile-details" class="modal-profile-details"></div>
        </div>
    </div>
    <script src="{% static 'friend_management.js' %}"></script>
</body>
</html>
