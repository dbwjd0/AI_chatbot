{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 비서의 방</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="{% static 'room.css' %}">
</head>
<body>
    <div class="container">
        <div style="position: absolute; top: 20px; right: 20px; color: #333; background-color: rgba(255, 255, 255, 0.8); padding: 10px; border-radius: 5px; z-index: 100;">
            <strong>{{ user.username }}</strong>님, 환영합니다.
            <a href="{% url 'logout' %}" style="color: #5E35B1; text-decoration: none; font-weight: bold; margin-left: 10px;">로그아웃</a>
        </div>
        <div class="chatbot-container" id="room">
            <div id="fade-overlay"></div>
            <img id="movable-character" src="{% static 'img/char_dot.png' %}" alt="AI Character">
            <a href="/chat" id="computer"></a>
        </div>
    </div>
    <script src="{% static 'room.js' %}"></script>
</body>
</html>
