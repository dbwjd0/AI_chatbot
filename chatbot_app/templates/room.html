{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "AI 비서의 방" %}</title>
    <script>
        function gettext(text) { return text; }
    </script>
    <script src="/jsi18n/"></script>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="{% static 'room.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        #toggle-bgm-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            z-index: 101;
        }
    </style>
</head>
<body>
    <button id="toggle-bgm-btn">{% trans "BGM OFF" %}</button>
    <input type="range" id="bgm-volume-slider" min="0" max="100" value="50">
    <div class="container" data-chatbot-name="{{ chatbot_name|default:'아이' }}">
    {% include 'includes/top_menu.html' with show_room_link=False %}
        <div class="chatbot-container" id="room">
            <!-- <img id="stove" class="furniture-object" src="{% static 'img/난로.png' %}" alt="Stove"> -->
            <img id="refrigerator" class="furniture-object interactive-object" data-interaction-target="refrigerator" data-interaction-message="{% trans "냉장고 확인하기 (Enter)" %}" src="{% static 'img/냉장고.png' %}" alt="{% trans "Refrigerator" %}">
            <img id="lamp" class="furniture-object" src="{% static 'img/램프.png' %}" alt="{% trans "Lamp" %}">
            <img id="robot-vacuum" class="furniture-object" src="{% static 'img/로봇청소기.png' %}" alt="{% trans "Robot Vacuum" %}">
            <img id="sofa" class="furniture-object interactive-object" data-interaction-target="sofa" data-interaction-message="{% trans "푹신한 소파에 앉아 휴식하기 (Enter)" %}" src="{% static 'img/소파.png' %}" alt="{% trans "Sofa" %}">
            <img id="wardrobe" class="furniture-object" src="{% static 'img/옷장.png' %}" alt="{% trans "Wardrobe" %}">
            <img id="books-desk" class="furniture-object interactive-object" data-interaction-target="schedule" data-interaction-message="{% trans "일정 확인 및 추가하기 (Enter)" %}" src="{% static 'img/책과 책상.png' %}" alt="{% trans "Books and Desk" %}">
            <img id="bed" class="furniture-object interactive-object" data-interaction-target="bed" data-interaction-message="{% trans "침대에 누워 쉬기 (Enter)" %}" src="{% static 'img/침대.png' %}" alt="{% trans "Bed" %}">
            <img id="computer-obj" class="furniture-object interactive-object" data-interaction-target="chat" data-interaction-message="{% trans "컴퓨터를 사용해 채팅하기 (Enter)" %}" src="{% static 'img/컴퓨터.png' %}" alt="{% trans "Computer" %}">
            <img id="tv" class="furniture-object interactive-object" data-interaction-target="chat_history" data-interaction-message="{% trans "TV를 켜서 대화하기 (Enter)" %}" src="{% static 'img/티비.png' %}" alt="{% trans "TV" %}">
            <img id="tea-table" class="furniture-object" src="{% static 'img/티테이블.png' %}" alt="{% trans "Tea Table" %}">
            <!-- <img id="wall-clock" class="furniture-object" src="{% static 'img/벽시계.png' %}" alt="Wall Clock"> -->
            <!-- <img id="wall-plant" class="furniture-object" src="{% static 'img/벽식물.png' %}" alt="Wall Plant"> -->
            <!-- <img id="storage-cabinet" class="furniture-object" src="{% static 'img/수납장.png' %}" alt="Storage Cabinet"> -->
            <img id="flower-pot" class="furniture-object" src="{% static 'img/화분.png' %}" alt="{% trans "Flower Pot" %}">
            <div id="invisible-wall-1" class="furniture-object"></div>
            <div id="invisible-wall-2" class="furniture-object"></div>
            <div id="invisible-wall-3" class="furniture-object"></div>
            <div id="invisible-wall-4" class="furniture-object"></div>
            <div id="invisible-wall-5" class="furniture-object"></div>
            <div id="invisible-wall-6" class="furniture-object"></div>
            <div id="invisible-wall-7" class="furniture-object"></div>
            <div id="invisible-wall-8" class="furniture-object"></div>
            <div id="invisible-wall-9" class="furniture-object"></div>
            <div id="invisible-wall-10" class="furniture-object"></div>
            <div id="invisible-wall-11" class="furniture-object"></div>
            <div id="invisible-wall-12" class="furniture-object"></div>
            <div id="invisible-wall-13" class="furniture-object"></div>
            <div id="invisible-wall-14" class="furniture-object"></div>
            <div id="invisible-wall-15" class="furniture-object"></div>
            <div id="invisible-wall-16" class="furniture-object"></div>
            <div id="invisible-wall-17" class="furniture-object"></div>
            <div id="Quiz-line" class="interactive-object" data-interaction-target="quiz"></div>
            <div id="player">
                <img src="{% static 'img/기본 프로필.png' %}" alt="{% trans "Player" %}">
            </div>

            <!-- Proactive Message Notification Bubble -->
            <div id="proactive-notification" style="display: none;">!</div>

            <div id="interaction-prompt"></div>
            <img id="dialog-character-image" src="" alt="Character Image" style="display: none;">
            <img id="bed-character-image" src="" alt="Bed Character Image" style="display: none;">
            <div id="dialog-box" class="hidden">
                <div id="dialog-speaker-container">
                    <span id="dialog-speaker"></span>
                </div>
                <div id="dialog-text"></div>
            </div>
            <div id="fade-overlay"></div>
        </div>
    </div>

    <!-- Schedule Modal -->
    <div id="schedule-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>{% trans "오늘의 일과" %}</h2>
            <div id="schedule-list-container">
                <!-- Schedules will be loaded here by JavaScript -->
            </div>
            <div class="schedule-input-form">
                <div class="input-group">
                    <input type="time" id="new-schedule-time-input" class="schedule-input" value="09:00">
                    <textarea id="new-schedule-textarea" placeholder="{% trans "새 일정을 입력하세요." %}" rows="2"></textarea>
                </div>
                <button id="add-schedule-btn">{% trans "일정 추가" %}</button>
            </div>
        </div>
    </div>

    <!-- Refrigerator Modal -->
    <div id="refrigerator-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>{% trans "냉장고" %}</h2>
            <div id="refrigerator-items">
                <img src="{% static 'img/카레.png' %}" alt="{% trans "카레" %}">
                <img src="{% static 'img/햄버거.png' %}" alt="{% trans "햄버거" %}">
                <img src="{% static 'img/콜라.png' %}" alt="{% trans "콜라" %}">
            </div>
        </div>
    </div>

    <script src="{% static 'room.js' %}"></script>

    <!-- 게임 페이지용 BGM (login.html 제외) -->
    <audio id="bgm2" loop>
        <source src="{% static 'music/game_bgm.mp3' %}" type="audio/mpeg">
    </audio>

    <script src="{% static 'bgm.js' %}"></script>
</body>
</html>
