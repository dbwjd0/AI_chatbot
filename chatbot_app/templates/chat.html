{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 비서와의 대화</title>
    <link rel="stylesheet" href="{% static 'chat.css' %}">
    <style>
        #toggle-bgm-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            z-index: 101;
        }
        #feedback-container {
            position: absolute;
            bottom: 240px; /* Position above the dialogue box */
            left: 50%;
            transform: translateX(460px); /* Move it to the right of the dialogue box */
            z-index: 25;
            display: flex;
            gap: 10px;
        }
        .feedback-button {
            background-color: rgba(0, 0, 0, 0.7);
            border: 1px solid #a9d1ff;
            color: white;
            font-size: 1.5em;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .feedback-button:hover {
            background-color: rgba(40, 40, 40, 0.9);
        }
    </style>
</head>
<body>
    <button id="toggle-bgm-btn">BGM OFF</button>
    <div class="game-container">
        {% include 'includes/top_menu.html' with show_room_link=True %}

        <div class="character-container">
            <img id="chatbot-character" src="{% static 'img/char_default.png' %}" alt="AI 비서">
            <div id="ai-emoticon-bubble" class="ai-emoticon-bubble" style="display: none;">
                <img id="ai-emoticon-img" src="" alt="AI Emoticon">
            </div>
        </div>

        <div class="dialogue-box">
            <div id="speaker-name">{{ user_profile.chatbot_name }}</div>
            <div id="dialogue-text">... (삐빅) ... 흥, 드디어 왔네. 뭘 시킬 셈이야?</div>
            <button id="prev-dialogue-button" class="dialogue-nav-button hidden">▲</button>
        </div>

        <div id="feedback-container" style="display: none;">
            <button id="thumb-up-button" class="feedback-button">👍</button>
            <button id="thumb-down-button" class="feedback-button">👎</button>
        </div>

        <div id="preview-container" class="preview-container" style="display: none;">
            <img id="image-preview" src="" alt="Image Preview">
            <button id="clear-image-button" class="icon-button" title="이미지 지우기">&times;</button>
        </div>

        <div id="emoticon-preview-container" class="emoticon-preview-container" style="display: none;">
            <img id="emoticon-preview" src="" alt="Emoticon Preview">
            <button id="clear-emoticon-button" class="icon-button" title="이모티콘 지우기">&times;</button>
        </div>

        <div id="emoticon-palette" class="emoticon-palette" style="display: none;">
            <!-- Emoticons will be loaded here by JavaScript -->
        </div>
        
        <div id="chat-input-container" class="chat-input-container">
            <div class="chat-input">
                <input type="file" id="image-input" accept="image/*" style="display: none;">
                <button id="attach-image-button" class="icon-button" title="이미지 첨부">📎</button>
                <button id="emoticon-button" class="icon-button" title="이모티콘 선택">😊</button>
                <input type="text" id="user-input" placeholder="메시지를 입력하세요...">
                <button id="send-button">전송</button>
                <div class="location-permission">
                    <input type="checkbox" id="location-checkbox">
                    <label for="location-checkbox">위치 정보 사용</label>
                </div>
            </div>
        </div>
    </div>

    {{ chat_messages|json_script:"chat_messages_data" }}
    <script>
        const chatHistory = JSON.parse(document.getElementById('chat_messages_data').textContent);
        const STATIC_URLS = {
            '생각': "{% static 'img/char_thinking.png' %}",
            '행복': "{% static 'img/char_happy.png' %}",
            '슬픔': "{% static 'img/char_sad.png' %}",
            '분노': "{% static 'img/char_angry.png' %}",
            '놀람': "{% static 'img/char_surprise.png' %}",
            '공포': "{% static 'img/char_fear.png' %}",
            '혐오': "{% static 'img/char_disgust.png' %}",
            '중립': "{% static 'img/char_default.png' %}",
            'default': "{% static 'img/char_default.png' %}"
        };
        const USERNAME = "{{ user.username }}";
        const CHATBOT_NAME = "{{ user_profile.chatbot_name|escapejs }}";
        const affinityScore = "{{ user_profile.affinity_score|default:0 }}";
    </script>
    <script src="{% static 'chat.js' %}"></script>

    <!-- 게임 페이지용 BGM (login.html 제외) -->
    <audio id="bgm2" loop>
        <source src="{% static 'music/game_bgm.mp3' %}" type="audio/mpeg">
    </audio>

    <script src="{% static 'bgm.js' %}"></script>
</body>
</html>
