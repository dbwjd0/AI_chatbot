{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "AI 비서와의 대화" %}</title>
    <link rel="stylesheet" href="{% static 'chat.css' %}">
    <style>
        #toggle-bgm-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            z-index: 101;
        }
        #bgm-volume-slider {
            position: absolute;
            top: 20px;
            left: 120px; /* Adjust as needed to position next to the button */
            width: 100px;
            z-index: 101;
            -webkit-appearance: none;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            height: 10px;
            outline: none;
        }
        #bgm-volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }
        #bgm-volume-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }
        #feedback-container {
            position: absolute;
            bottom: 90px; /* Position above the dialogue box */
            left: 54%;
            transform: translateX(460px); /* Move it to the right of the dialogue box */
            z-index: 25;
            display: flex;
            gap: 10px;
        }
        .feedback-button {
            background-color: rgba(0, 0, 0, 0.7);
            border: 1px solid #a9d1ff;
            color: white;
            font-size: 1.5em;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .feedback-button:hover {
            background-color: rgba(40, 40, 40, 0.9);
        }
    </style>
</head>
<body>
    <video autoplay muted loop class="background-video">
        <source src="{% static 'img/Main Room_.mp4' %}" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <button id="toggle-bgm-btn">{% trans "BGM OFF" %}</button>
    <input type="range" id="bgm-volume-slider" min="0" max="100" value="50">
    <div class="game-container">
        <div id="saved-info-notification" style="display: none;"></div>
        {% include 'includes/top_menu.html' with show_room_link=True %}

        <div class="character-container">
            <img id="chatbot-character" src="{% static 'img/char_default.png' %}" alt="{% trans "AI 비서" %}">
            <div id="ai-emoticon-bubble" class="ai-emoticon-bubble" style="display: none;">
                <img id="ai-emoticon-img" src="" alt="AI Emoticon">
            </div>
        </div>

        <div class="dialogue-box">
            <div id="speaker-name">{{ user_profile.chatbot_name }}</div>
            <div id="dialogue-text">{% trans "... (삐빅) ... 흥, 드디어 왔네. 뭘 시킬 셈이야?" %}</div>
            <button id="prev-dialogue-button" class="dialogue-nav-button hidden">▲</button>
        </div>

        <div id="feedback-container" style="display: none;">
            <button id="thumb-up-button" class="feedback-button">👍</button>
            <button id="thumb-down-button" class="feedback-button">👎</button>
        </div>

        <div id="preview-container" class="preview-container" style="display: none;">
            <img id="image-preview" src="" alt="Image Preview">
            <button id="clear-image-button" class="icon-button" title="{% trans "이미지 지우기" %}">&times;</button>
        </div>

        <div id="emoticon-preview-container" class="emoticon-preview-container" style="display: none;">
            <img id="emoticon-preview" src="" alt="Emoticon Preview">
            <button id="clear-emoticon-button" class="icon-button" title="{% trans "이모티콘 지우기" %}">&times;</button>
        </div>

        <div id="emoticon-palette" class="emoticon-palette" style="display: none;">
            <!-- Emoticons will be loaded here by JavaScript -->
        </div>
        
        <div id="chat-input-container" class="chat-input-container">
            <div class="chat-input">
                <input type="file" id="image-input" accept="image/*" style="display: none;">
                <button id="message-button" class="icon-button" title="{% trans "쪽지 보내기" %}">✉️</button>
                <button id="unread-messages-button" class="icon-button" title="{% trans "읽지 않은 쪽지" %}">
                    <span class="unread-indicator">{{ unread_friend_messages_count }}</span>
                </button>
                <button id="attach-image-button" class="icon-button" title="{% trans "이미지 첨부" %}">📎</button>
                <button id="emoticon-button" class="icon-button" title="{% trans "이모티콘 선택" %}">😊</button>
                <input type="text" id="user-input" placeholder="{% trans "메시지를 입력하세요..." %}">
                <select id="friend-receiver-select" style="display: none;">
                    <option value="">{% trans "친구 선택" %}</option>
                </select>
                <input type="text" id="friend-message-input" placeholder="{% trans "친구에게 쪽지를 보내세요..." %}" style="display: none;">
                <button id="send-button">{% trans "전송" %}</button>
                <button id="send-friend-message-button" style="display: none;">{% trans "쪽지 전송" %}</button>
                <div class="location-permission">
                    <input type="checkbox" id="location-checkbox">
                    <label for="location-checkbox">{% trans "위치 정보 사용" %}</label>
                </div>
            </div>
        </div>
    </div>

    {{ chat_messages|json_script:"chat_messages_data" }}
    <script>
        const chatHistory = JSON.parse(document.getElementById('chat_messages_data').textContent);
        const STATIC_URLS = {
            '생각': "{% static 'img/char_thinking.png' %}",
            '행복': "{% static 'img/char_happy.png' %}",
            '슬픔': "{% static 'img/char_sad.png' %}",
            '분노': "{% static 'img/char_angry.png' %}",
            '놀람': "{% static 'img/char_surprise.png' %}",
            '공포': "{% static 'img/char_fear.png' %}",
            '혐오': "{% static 'img/char_disgust.png' %}",
            '중립': "{% static 'img/char_default.png' %}",
            'default': "{% static 'img/char_default.png' %}"
        };
        const TRANSLATED_EMOTIONS = {
            '생각': '{% trans "생각" %}',
            '행복': '{% trans "행복" %}',
            '슬픔': '{% trans "슬픔" %}',
            '분노': '{% trans "분노" %}',
            '놀람': '{% trans "놀람" %}',
            '공포': '{% trans "공포" %}',
            '혐오': '{% trans "혐오" %}',
            '중립': '{% trans "중립" %}',
        };
        const USERNAME = "{{ user.username }}";
        const USER_NICKNAME = "{{ user_profile.nickname|default:user.username|escapejs }}"; // Add this line
        const CHATBOT_NAME = "{{ user_profile.chatbot_name|escapejs }}";
        const affinityScore = "{{ user_profile.affinity_score|default:0 }}";
        const UNREAD_MESSAGE_COUNT = "{{ unread_friend_messages_count }}";
    </script>
    <audio id="bgm2" loop>
        <source src="{% static 'music/game_bgm.mp3' %}" type="audio/mpeg">
    </audio>

    <script src="{% static 'bgm.js' %}"></script>
    <script src="{% static 'chat.js' %}"></script>

    <script type="text/javascript" src="{% url 'javascript-catalog' %}"></script>
</body>
</html>
