{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>츤데레 AI 비서</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="container">
        <div style="position: absolute; top: 20px; right: 20px; color: #333; background-color: rgba(255, 255, 255, 0.8); padding: 10px; border-radius: 5px; z-index: 100;">
            <strong>{{ user.username }}</strong>님, 환영합니다.
            <a href="{% url 'room' %}" style="color: #5E35B1; text-decoration: none; font-weight: bold; margin-right: 10px;">방으로 돌아가기</a>
            <a href="{% url 'ai_status' %}" style="color: #5E35B1; text-decoration: none; font-weight: bold; margin-right: 10px;">아이 상태</a>
            <a href="{% url 'logout' %}" style="color: #5E35B1; text-decoration: none; font-weight: bold; margin-left: 10px;">로그아웃</a>
        </div>
        <div class="chatbot-container">
            <div class="character-display">
                <img id="chatbot-character" src="{% static 'img/char_default.png' %}" alt="AI 비서">
            </div>
            <div class="chat-window">
                <div id="chat-log" class="chat-log" data-has-next-page="{{ has_next_page|yesno:'true,false' }}">
                    {% for message in chat_messages %}
                        <div class="message {% if message.is_user %}user-message{% else %}bot-message{% endif %}">
                            <p>{{ message.message }}</p>
                        </div>
                    {% empty %}
                        <div class="message bot-message">
                            <p>... (삐빅) ... 흥, 드디어 왔네. 뭘 시킬 셈이야?</p>
                        </div>
                    {% endfor %}
                </div>
                <div class="chat-input">
                    <input type="file" id="image-input" accept="image/*" style="display: none;">
                    <button id="attach-image-button" class="icon-button">📎</button> <!-- 클립 아이콘 버튼 -->
                    <img id="image-preview" src="" alt="Image Preview" style="max-width: 50px; max-height: 50px; margin-right: 10px; display: none;">
                    <button id="clear-image-button" class="icon-button" style="display: none; margin-right: 10px;">❌</button> <!-- 이미지 지우기 버튼 -->
                    <input type="text" id="user-input" placeholder="메시지를 입력하세요...">
                    <button id="send-button">전송</button>
                    <div class="location-permission" style="display: flex; align-items: center; margin-left: 10px; font-size: 14px;">
                        <input type="checkbox" id="location-checkbox" style="margin-right: 5px;">
                        <label for="location-checkbox">위치 정보 사용</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
        {{ chat_messages|json_script:"chat_messages_data" }}
        <script>
        const chatHistory = JSON.parse(document.getElementById('chat_messages_data').textContent);
        const STATIC_URLS = {
            '생각': "{% static 'img/char_thinking.png' %}",
            '행복': "{% static 'img/char_happy.png' %}",
            '슬픔': "{% static 'img/char_sad.png' %}",
            '분노': "{% static 'img/char_angry.png' %}",
            '놀람': "{% static 'img/char_surprise.png' %}",      // 임시 이미지
            '공포': "{% static 'img/char_fear.png' %}",     // 임시 이미지 
            '혐오': "{% static 'img/char_disgust.png' %}",  // 임시 이미지      
            '중립': "{% static 'img/char_default.png' %}",
            'default': "{% static 'img/char_default.png' %}" // 기본값
        };
    </script>
    <script src="{% static 'script.js' %}"></script>
</body>
</html>
