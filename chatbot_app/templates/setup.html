{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초기 설정</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="{% static 'setup.css' %}">
</head>
<body>
    <div class="container">
        <div class="chatbot-container setup-container">
            <div class="character-display">
                <img id="character-image" src="{% static 'img/char_carrot_default.png' %}" alt="AI 비서">
            </div>
            <div class="dialogue-frame">
                {% if setup_complete %}
                    <p id="question-text">{{ completion_message }}</p>
                    <p id="next-step-instruction">{{ next_step_instruction }}</p>
                    <form method="post" id="setup-form" style="display:none;">
                        {% csrf_token %}
                        <input type="text" name="answer" id="answer-input" autocomplete="off" required>
                        <input type="hidden" id="fact-type" value="{{ fact_type }}">
                        <input type="hidden" id="setup-complete-flag" value="{{ setup_complete|yesno:"true,false" }}">
                        <button type="submit">확인</button>
                    </form>
                {% else %}
                    <p id="question-text">{{ question }}</p>
                    <form method="post" id="setup-form">
                        {% csrf_token %}
                        <input type="text" name="answer" id="answer-input" autocomplete="off" required>
                        <input type="hidden" id="fact-type" value="{{ fact_type }}">
                        <button type="submit">확인</button>
                    </form>
                {% endif %}
            </div>
        </div>
    </div>
    <script src="{% static 'setup.js' %}"></script>
</body>
</html>
